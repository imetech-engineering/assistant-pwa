<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>IMeTech Assistent</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <!-- Icoontjes als inline SVG (zelfde aanpak als projectdoc-pwa): offline, en ze volgen de tekstkleur -->
    <svg class="ic-sprite" aria-hidden="true" focusable="false">
      <symbol id="ic-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0" /><path d="M12 18v3" /><path d="M8.5 21h7" /></symbol>
      <symbol id="ic-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></symbol>
      <symbol id="ic-versturen" viewBox="0 0 24 24"><path d="M21 3L3 10.5l7 3 3 7L21 3z" /><path d="M10 13.5L21 3" /></symbol>
      <symbol id="ic-vink" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" /></symbol>
      <symbol id="ic-klok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
      <symbol id="ic-kalender" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18" /><path d="M8 3v4M16 3v4" /></symbol>
      <symbol id="ic-sluiten" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
      <symbol id="ic-terug" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></symbol>
      <symbol id="ic-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></symbol>
      <symbol id="ic-herstel" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9" /><path d="M4 4v5h5" /></symbol>
      <symbol id="ic-luidspreker" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16 9a4 4 0 0 1 0 6" /></symbol>
      <symbol id="ic-assistent" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6z" /><path d="M10 20a2 2 0 0 0 4 0" /><path d="M9.5 11l2 2 3.5-3.5" /></symbol>
      <symbol id="ic-lijst" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13" /><path d="M3 6h.01M3 12h.01M3 18h.01" /></symbol>
      <symbol id="ic-instellingen" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></symbol>
    </svg>

    <div id="install-banner" class="install-banner hidden" role="dialog" aria-label="App installeren">
      <div class="install-banner-inner">
        <p><strong>Installeer IMeTech Assistent</strong> op je startscherm. Dan komen meldingen ook binnen als de app dicht is.</p>
        <div class="install-banner-actions">
          <button type="button" id="btn-install" class="btn-primary">Installeren</button>
          <button type="button" id="btn-install-dismiss" class="btn-secondary">Later</button>
        </div>
      </div>
    </div>

    <header class="app-header">
      <div class="header-text">
        <h1 id="kop">Assistent</h1>
        <p id="status" class="sub">—</p>
      </div>
      <img id="header-logo" class="header-logo" src="branding/logo-zwart.png" alt="IMeTech Engineering" width="120" height="28" />
    </header>

    <div id="ptr" class="ptr" aria-hidden="true"><svg class="ic"><use href="#ic-herstel"/></svg><span>Trek om te vernieuwen</span></div>
    <main id="scherm"></main>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button type="button" data-tab="assistent" class="actief"><svg class="ic"><use href="#ic-assistent"/></svg>Assistent</button>
      <button type="button" data-tab="overzicht"><svg class="ic"><use href="#ic-lijst"/></svg>Overzicht <span id="badge" class="badge"></span></button>
      <button type="button" data-tab="instellingen"><svg class="ic"><use href="#ic-instellingen"/></svg>Instellingen</button>
    </nav>

    <div id="toast" class="toast hidden" role="status"><span id="toast-tekst"></span><button type="button" id="toast-knop" class="toast-knop hidden">Herstel</button></div>

    <script src="js/opslag.js"></script>
    <script src="js/api.js"></script>
    <script src="js/spraak.js"></script>
    <script src="js/install.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
