# Publiceert alleen de PWA (map pwa/) naar GitHub Pages. Backend, config en data blijven buiten deze repo.
# Repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy assistant PWA

on:
  push:
    branches: [main, master]
    paths: ["pwa/**", ".github/workflows/deploy-assistant-pwa.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-assistant-pwa
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'imetech-engineering/assistant-pwa'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: deployment
        uses: actions/deploy-pages@v4
